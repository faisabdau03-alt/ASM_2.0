[project]
name = "asm-transport-kebumen"
version = "2.0.0"
description = "ASM Transport Kebumen V2 Corporate Website"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Migrate>=4.0.0",
    "Flask-Login>=0.6.0",
    "Flask-WTF>=1.2.0",
    "WTForms>=3.1.0",
    "email-validator>=2.2.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "Werkzeug>=3.0.0"
]

[tool.vercel]
entrypoint = "run:app"
